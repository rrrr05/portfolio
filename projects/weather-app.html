<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast — Погодное приложение</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --card-solid: #1e293b;
      --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3);
      --warm: #fbbf24; --text: #f1f5f9; --text-dim: #94a3b8; --text-muted: #64748b;
      --border: rgba(148, 163, 184, 0.1); --radius: 24px; --font: "Inter", sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    .bg-gradient { position: fixed; inset: 0; z-index: 0; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
    .bg-gradient::before { content: ""; position: absolute; width: 600px; height: 600px; top: -200px; right: -200px; background: radial-gradient(circle, rgba(56, 189, 248, 0.1), transparent 70%); border-radius: 50%; }
    .bg-gradient::after { content: ""; position: absolute; width: 400px; height: 400px; bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(251, 191, 36, 0.08), transparent 70%); border-radius: 50%; }
    .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 24px 20px; min-height: 100vh; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .location { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.1rem; }
    .location svg { width: 18px; height: 18px; color: var(--accent); }
    .settings-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.3s; }
    .settings-btn:hover { border-color: var(--accent); }
    .settings-btn svg { width: 18px; height: 18px; }
    .main-card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; text-align: center; margin-bottom: 24px; position: relative; overflow: hidden; }
    .main-card::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 180deg, transparent, var(--accent-glow), transparent); animation: rotate-card 8s linear infinite; opacity: 0.3; }
    @keyframes rotate-card { to { transform: rotate(360deg); } }
    .main-card > * { position: relative; }
    .weather-icon { font-size: 5rem; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .temperature { font-size: 5rem; font-weight: 700; line-height: 1; letter-spacing: -3px; margin-bottom: 4px; }
    .temp-unit { font-size: 2rem; font-weight: 300; color: var(--text-dim); vertical-align: super; }
    .condition { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 24px; font-weight: 500; }
    .temp-range { display: flex; justify-content: center; gap: 24px; }
    .temp-hi, .temp-lo { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .temp-hi svg { color: var(--warm); width: 16px; height: 16px; }
    .temp-lo svg { color: var(--accent); width: 16px; height: 16px; }
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .detail-card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: border-color 0.3s, transform 0.3s; }
    .detail-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .detail-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .detail-value { font-size: 1.4rem; font-weight: 600; }
    .detail-icon { font-size: 1.2rem; margin-bottom: 8px; display: block; }
    .detail-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .forecast { margin-bottom: 24px; }
    .forecast-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .forecast-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; -ms-overflow-style: none; scrollbar-width: none; }
    .forecast-scroll::-webkit-scrollbar { display: none; }
    .hour-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 12px; text-align: center; min-width: 72px; flex-shrink: 0; transition: border-color 0.3s, transform 0.3s; }
    .hour-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .hour-card.now { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .hour-time { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .hour-icon { font-size: 1.5rem; margin-bottom: 8px; }
    .hour-temp { font-size: 0.95rem; font-weight: 600; }
    .weekly { margin-bottom: 24px; }
    .weekly-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .weekly-row { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); transition: background 0.3s; }
    .weekly-row:last-child { border-bottom: none; }
    .weekly-row:hover { background: rgba(56, 189, 248, 0.05); }
    .weekly-day { width: 50px; font-weight: 500; font-size: 0.9rem; }
    .weekly-icon { width: 36px; text-align: center; font-size: 1.3rem; }
    .weekly-bar { flex: 1; margin: 0 16px; height: 4px; background: var(--border); border-radius: 2px; position: relative; overflow: hidden; }
    .weekly-bar-fill { position: absolute; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--warm)); transition: width 1s ease; }
    .weekly-temps { display: flex; gap: 16px; font-size: 0.85rem; }
    .weekly-hi { font-weight: 600; }
    .weekly-lo { color: var(--text-muted); }
    .search-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding-top: 120px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .search-overlay.open { opacity: 1; pointer-events: all; }
    .search-box { width: 100%; max-width: 480px; padding: 0 20px; }
    .search-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; color: var(--text); font-size: 1.1rem; font-family: var(--font); outline: none; transition: border-color 0.3s; }
    .search-input:focus { border-color: var(--accent); }
    .search-results { margin-top: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .search-result { padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 12px; }
    .search-result:hover { background: rgba(56, 189, 248, 0.08); }
    .search-result:last-child { border-bottom: none; }
    .search-result svg { color: var(--text-muted); width: 16px; height: 16px; flex-shrink: 0; }
    @media (max-width: 480px) { .app { padding: 16px 12px; } .temperature { font-size: 4rem; } }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app" id="app">
    <div class="top-bar">
      <div class="location" id="locationBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="cityName">Москва</span>
      </div>
      <button class="settings-btn" id="searchBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>

    <div class="main-card">
      <span class="weather-icon" id="mainIcon">🌤</span>
      <div class="temperature" id="mainTemp">18<span class="temp-unit">°C</span></div>
      <div class="condition" id="mainCondition">Переменная облачность</div>
      <div class="temp-range">
        <div class="temp-hi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> 22°</div>
        <div class="temp-lo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg> 14°</div>
      </div>
    </div>

    <div class="details-grid">
      <div class="detail-card">
        <span class="detail-icon">💨</span>
        <div class="detail-label">Ветер</div>
        <div class="detail-value">12 км/ч</div>
        <div class="detail-sub">Юго-западный</div>
      </div>
      <div class="detail-card">
        <span class="detail-icon">💧</span>
        <div class="detail-label">Влажность</div>
        <div class="detail-value">68%</div>
        <div class="detail-sub">Комфортно</div>
      </div>
      <div class="detail-card">
        <span class="detail-icon">🌡</span>
        <div class="detail-label">Давление</div>
        <div class="detail-value">745 мм</div>
        <div class="detail-sub">Нормальное</div>
      </div>
      <div class="detail-card">
        <span class="detail-icon">☀</span>
        <div class="detail-label">UV Индекс</div>
        <div class="detail-value">3</div>
        <div class="detail-sub">Умеренный</div>
      </div>
    </div>

    <div class="forecast">
      <div class="forecast-title">Почасовой прогноз</div>
      <div class="forecast-scroll" id="hourlyScroll"></div>
    </div>

    <div class="weekly">
      <div class="forecast-title">Прогноз на неделю</div>
      <div class="weekly-list" id="weeklyList"></div>
    </div>
  </div>

  <div class="search-overlay" id="searchOverlay">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск города...">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <script>
    const cities = {
      'Москва': { temp: 18, icon: '🌤', condition: 'Переменная облачность', hi: 22, lo: 14, wind: 12, windDir: 'Юго-западный', humidity: 68, pressure: 745, uv: 3 },
      'Санкт-Петербург': { temp: 12, icon: '🌧', condition: 'Дождь', hi: 15, lo: 9, wind: 18, windDir: 'Западный', humidity: 85, pressure: 738, uv: 1 },
      'Сочи': { temp: 28, icon: '☀️', condition: 'Ясно', hi: 32, lo: 24, wind: 6, windDir: 'Южный', humidity: 55, pressure: 752, uv: 7 },
      'Новосибирск': { temp: 8, icon: '⛅', condition: 'Облачно', hi: 11, lo: 4, wind: 20, windDir: 'Северный', humidity: 72, pressure: 742, uv: 2 },
      'Казань': { temp: 15, icon: '🌥', condition: 'Облачно с прояснениями', hi: 19, lo: 11, wind: 14, windDir: 'Восточный', humidity: 65, pressure: 748, uv: 4 },
    };

    const hourlyData = [
      { time: 'Сейчас', icon: '🌤', temp: 18, now: true },
      { time: '14:00', icon: '☀️', temp: 20 },
      { time: '15:00', icon: '☀️', temp: 22 },
      { time: '16:00', icon: '🌤', temp: 21 },
      { time: '17:00', icon: '⛅', temp: 19 },
      { time: '18:00', icon: '🌥', temp: 17 },
      { time: '19:00', icon: '🌙', temp: 16 },
      { time: '20:00', icon: '🌙', temp: 15 },
      { time: '21:00', icon: '🌙', temp: 14 },
    ];

    const weeklyData = [
      { day: 'Пн', icon: '☀️', hi: 22, lo: 14, fill: 65 },
      { day: 'Вт', icon: '🌤', hi: 20, lo: 13, fill: 55 },
      { day: 'Ср', icon: '🌧', hi: 15, lo: 10, fill: 30 },
      { day: 'Чт', icon: '⛅', hi: 17, lo: 11, fill: 40 },
      { day: 'Пт', icon: '☀️', hi: 24, lo: 16, fill: 75 },
      { day: 'Сб', icon: '☀️', hi: 26, lo: 18, fill: 85 },
      { day: 'Вс', icon: '🌤', hi: 23, lo: 15, fill: 70 },
    ];

    function renderHourly() {
      const scroll = document.getElementById('hourlyScroll');
      scroll.innerHTML = hourlyData.map(h => `
        <div class="hour-card ${h.now ? 'now' : ''}">
          <div class="hour-time">${h.time}</div>
          <div class="hour-icon">${h.icon}</div>
          <div class="hour-temp">${h.temp}°</div>
        </div>
      `).join('');
    }

    function renderWeekly() {
      const list = document.getElementById('weeklyList');
      list.innerHTML = weeklyData.map(d => `
        <div class="weekly-row">
          <div class="weekly-day">${d.day}</div>
          <div class="weekly-icon">${d.icon}</div>
          <div class="weekly-bar"><div class="weekly-bar-fill" style="width:${d.fill}%"></div></div>
          <div class="weekly-temps"><span class="weekly-hi">${d.hi}°</span><span class="weekly-lo">${d.lo}°</span></div>
        </div>
      `).join('');
    }

    function updateCity(name) {
      const data = cities[name];
      if (!data) return;
      document.getElementById('cityName').textContent = name;
      document.getElementById('mainIcon').textContent = data.icon;
      document.getElementById('mainTemp').innerHTML = `${data.temp}<span class="temp-unit">°C</span>`;
      document.getElementById('mainCondition').textContent = data.condition;
      document.querySelector('.temp-hi').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> ${data.hi}°`;
      document.querySelector('.temp-lo').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg> ${data.lo}°`;
      const details = document.querySelectorAll('.detail-value');
      const subs = document.querySelectorAll('.detail-sub');
      details[0].textContent = data.wind + ' км/ч'; subs[0].textContent = data.windDir;
      details[1].textContent = data.humidity + '%'; subs[1].textContent = data.humidity > 70 ? 'Сыро' : 'Комфортно';
      details[2].textContent = data.pressure + ' мм'; subs[2].textContent = data.pressure > 745 ? 'Повышенное' : 'Нормальное';
      details[3].textContent = data.uv; subs[3].textContent = data.uv > 5 ? 'Высокий' : 'Умеренный';
    }

    const searchOverlay = document.getElementById('searchOverlay');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    document.getElementById('searchBtn').addEventListener('click', () => {
      searchOverlay.classList.add('open');
      setTimeout(() => searchInput.focus(), 100);
    });

    searchOverlay.addEventListener('click', e => {
      if (e.target === searchOverlay) { searchOverlay.classList.remove('open'); searchInput.value = ''; }
    });

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      const matches = Object.keys(cities).filter(c => c.toLowerCase().includes(q));
      searchResults.innerHTML = matches.map(c => `
        <div class="search-result" data-city="${c}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>${c}</span>
        </div>
      `).join('') || '<div class="search-result"><span>Город не найден</span></div>';
      searchResults.querySelectorAll('[data-city]').forEach(el => {
        el.addEventListener('click', () => {
          updateCity(el.dataset.city);
          searchOverlay.classList.remove('open');
          searchInput.value = '';
        });
      });
    });

    renderHourly();
    renderWeekly();
  </script>
</body>
</html>
