<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <section class="error-page">
    <div class="error-content">
      <span class="error-code">404</span>
      <h1>Страница не найдена</h1>
      <p>Кажется, эта страница ушла в другой дизайн-макет</p>
      <a href="index.html" class="btn btn-primary btn-arrow">Вернуться домой</a>
    </div>
  </section>

  <script>
    const cursorDot = document.getElementById('cursorDot');
    const cursorRing = document.getElementById('cursorRing');
    const cursorGlow = document.getElementById('cursorGlow');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      cursorDot.style.left=mx+'px'; cursorDot.style.top=my+'px';
      cursorGlow.style.left=mx+'px'; cursorGlow.style.top=my+'px';
      cursorGlow.classList.add('active');
    });
    (function a(){rx+=(mx-rx)*0.15;ry+=(my-ry)*0.15;cursorRing.style.left=rx+'px';cursorRing.style.top=ry+'px';requestAnimationFrame(a)})();
  </script>
</body>
</html>
